name: Feature request
description: A layout, theme, storyline, engine or workflow step you need for a real deck.
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: What are you trying to make?
      description: The deck, its audience and the slide or step where SlideCraft falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A layout sketch, an example slide (no client material), or the behaviour you expect.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Layout or chart, Theme or brand, Storyline or method, Output engine (PPTX/PDF/HTML), Assistant integration (ChatGPT, Claude, Codex, MCP), Other]
    validations:
      required: true
