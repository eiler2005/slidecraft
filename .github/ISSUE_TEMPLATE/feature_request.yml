name: Feature request
description: Suggest an improvement to the CLI, plugin, themes or QA checks.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Sketch the CLI flag, spec field or behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CLI, Claude Code plugin, Layouts, Themes, Charts, QA checks, Export backends, Docs, Other]
    validations:
      required: true
