name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload visual-regression renders
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-${{ matrix.os }}
          path: tests/.output/visual
          if-no-files-found: ignore
          retention-days: 7

      - name: Bundle is up to date (dist/ is committed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/bundle.mjs
          git diff --exit-code dist/

      - name: Showcase deck is up to date (docs/showcase is committed)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run showcase
          git diff --exit-code docs/showcase

      - name: Generated reference docs and schemas are up to date
        if: hashFiles('docs/reference/*.gen.md') != ''
        run: |
          npm run gen
          git diff --exit-code docs/reference schemas library/catalog.json

      - name: Validate the skeleton fixture with the committed bundle
        run: node dist/slidecraft.mjs validate tests/fixtures/skeleton/deck.yaml

      - name: Build the skeleton fixture
        run: node dist/slidecraft.mjs build tests/fixtures/skeleton/deck.yaml -o out/ci

      - name: Upload deck preview
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: deck-preview
          path: out/ci
          if-no-files-found: warn
          retention-days: 14

      - name: Privacy check (all tracked files)
        run: .githooks/privacy-check tree

  minimum-node-smoke:
    name: smoke (minimum Node 22.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Build with the standalone bundle
        run: node dist/slidecraft.mjs build tests/fixtures/skeleton/deck.yaml -o out/minimum-node -f pptx,pdf,png
      - name: Read PDF text and styles without npm install
        run: node scripts/smoke-pdf-reader.mjs

  windows-smoke:
    # Most people who present work on Windows: build real decks there with the committed bundle.
    name: smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Build an example deck (PPTX, PDF, PNG, one-pager, DOCX)
        run: |
          node dist/slidecraft.mjs --version
          node dist/slidecraft.mjs build examples/europe-first-trip/deck.yaml -o out/win -f pptx,pdf,png,onepager,docx
          node dist/slidecraft.mjs new "The board approves a partner-led entry into Germany" --dir out/new
          node dist/slidecraft.mjs check examples/slidecraft-overview/deck.yaml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-smoke
          path: out
          if-no-files-found: warn
          retention-days: 7
