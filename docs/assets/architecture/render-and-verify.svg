<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="render-and-verify-title render-and-verify-desc" id="render-and-verify-root">
<title id="render-and-verify-title">One composition, multiple engines and checks</title><desc id="render-and-verify-desc">HTML and editable PPTX share Scene IR; object checks and real Office rendering complement visual comparison.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #render-and-verify-root { --color-paper:   #F5F7FA;
      --color-ink:     #0A2033;
      --color-muted:   #596E7C;
      --color-accent:  #0960D5;
      --font-sans:     Arial, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #render-and-verify-root { font-family: var(--font-sans); color: var(--color-ink); }
      #render-and-verify-root .diagram-container { width: 100%; overflow-x: auto; }
      #render-and-verify-root .diagram-container { overflow-x: visible; }</style><marker id="render-and-verify-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#596E7C"/></marker><marker id="render-and-verify-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0960D5"/></marker><marker id="render-and-verify-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0960D5"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FA"/>
<text x="40" y="60" font-family="Arial" font-size="12" fill="#596E7C">SLIDECRAFT / ARCHITECTURE</text>
<text x="40" y="112" font-family="Arial" font-size="40" font-weight="600" fill="#0A2033">One composition, multiple engines and checks</text>
<path d="M280 324 H304 Q312 324 312 316 V232 Q312 224 320 224 H360" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M280 356 H320 Q328 356 328 364 V456 Q328 464 336 464 H360" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M616 464 H680" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M808 416 V368" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M616 224 H664 Q672 224 672 232 V312 Q672 320 680 320 H704" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M616 496 H640 Q648 496 648 504 V576 Q648 584 656 584 H680" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M936 320 H1000" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><path d="M936 584 H1112 Q1120 584 1120 576 V368" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#render-and-verify-arrow)"/><g><rect x="40" y="292" width="240" height="96" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="56" y="322" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Scene IR</text><text x="56" y="346" font-family="Arial" font-size="12" fill="#596E7C">Text · shapes · tables</text><text x="56" y="366" font-family="Arial" font-size="12" fill="#596E7C">Charts · sources · speaker notes</text></g><g><rect x="360" y="176" width="256" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="376" y="206" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">HTML / SVG</text><text x="376" y="230" font-family="Arial" font-size="12" fill="#596E7C">Render the shared composition</text><text x="376" y="250" font-family="Arial" font-size="12" fill="#596E7C">Frozen visual reference</text></g><g><rect x="360" y="416" width="256" height="112" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="376" y="446" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Editable PPTX</text><text x="376" y="470" font-family="Arial" font-size="12" fill="#596E7C">pptxgenjs by default</text><text x="376" y="490" font-family="Arial" font-size="12" fill="#596E7C">OpenAI: internal evaluation only</text><text x="376" y="510" font-family="Arial" font-size="12" fill="#596E7C">Never flatten the slide into an image</text></g><g><rect x="680" y="416" width="256" height="112" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="696" y="446" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Office render</text><text x="696" y="470" font-family="Arial" font-size="12" fill="#596E7C">PPTX → PowerPoint / LibreOffice</text><text x="696" y="490" font-family="Arial" font-size="12" fill="#596E7C">PDF → page images</text></g><g><rect x="704" y="272" width="232" height="96" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="720" y="302" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Visual comparison</text><text x="720" y="326" font-family="Arial" font-size="12" fill="#596E7C">HTML ↔ actual PPTX render</text><text x="720" y="346" font-family="Arial" font-size="12" fill="#596E7C">Target ≥95%; measurement required</text></g><g><rect x="680" y="544" width="256" height="80" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="696" y="574" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Content and object checks</text><text x="696" y="598" font-family="Arial" font-size="12" fill="#596E7C">Text · notes · chrome · objects</text></g><g><rect x="1000" y="272" width="240" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="1016" y="302" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Report + corrections</text><text x="1016" y="326" font-family="Arial" font-size="12" fill="#596E7C">Defects, limitations, engine versions</text><text x="1016" y="346" font-family="Arial" font-size="12" fill="#596E7C">A build is not a quality guarantee</text></g>
<line x1="40" y1="656" x2="1240" y2="656" stroke="#DCE3EB"/>
<text x="40" y="688" font-family="Arial" font-size="12" fill="#596E7C">resvg previews the Scene, not PowerPoint output. Structural tests do not replace visual comparison and slide-by-slide review.</text></svg>
