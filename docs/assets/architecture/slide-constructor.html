<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From content to a shared composition</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F5F7FA;
      --color-ink:     #0A2033;
      --color-muted:   #596E7C;
      --color-accent:  #0960D5;
      --font-sans:     Arial, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>

e="#DCE3EB"/><text x="376" y="398" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Existing component library</text><text x="376" y="422" font-family="Arial" font-size="12" fill="#596E7C">Layout contracts and variants</text><text x="376" y="442" font-family="Arial" font-size="12" fill="#596E7C">Add a component only to fill a gap</text></g><g><rect x="712" y="272" width="240" height="112" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="728" y="302" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Slide constructor</text><text x="728" y="326" font-family="Arial" font-size="12" fill="#596E7C">Components + slide regions</text><text x="728" y="346" font-family="Arial" font-size="12" fill="#596E7C">One shared frame, no duplication</text></g><g><rect x="712" y="480" width="240" height="112" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="728" y="510" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Theme + slide chrome</text><text x="728" y="534" font-family="Arial" font-size="12" fill="#596E7C">7 themes, independent of storyline</text><text x="728" y="554" font-family="Arial" font-size="12" fill="#596E7C">Fonts · colour · source labels</text><text x="728" y="574" font-family="Arial" font-size="12" fill="#596E7C">Page number · margins · takeaway</text></g><g><rect x="1024" y="280" width="216" height="96" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="1040" y="310" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Scene IR</text><text x="1040" y="334" font-family="Arial" font-size="12" fill="#596E7C">Text + geometry + roles</text><text x="1040" y="354" font-family="Arial" font-size="12" fill="#596E7C">Shared input to renderers</text></g>
<line x1="40" y1="656" x2="1240" y2="656" stroke="#DCE3EB"/>
<text x="40" y="688" font-family="Arial" font-size="12" fill="#596E7C">Storyline = the argument · exhibit = how to show the idea · theme = the look. Every storyline works with every theme.</text></svg>
    </div>
  </div>
