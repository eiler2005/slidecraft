<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slide-constructor-title slide-constructor-desc" id="slide-constructor-root">
<title id="slide-constructor-title">From content to a shared composition</title><desc id="slide-constructor-desc">Storyline, semantic patterns, existing components and an independent theme compose a slide into shared Scene IR.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #slide-constructor-root { --color-paper:   #F5F7FA;
      --color-ink:     #0A2033;
      --color-muted:   #596E7C;
      --color-accent:  #0960D5;
      --font-sans:     Arial, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #slide-constructor-root { font-family: var(--font-sans); color: var(--color-ink); }
      #slide-constructor-root .diagram-container { width: 100%; overflow-x: auto; }
      #slide-constructor-root .diagram-container { overflow-x: visible; }</style><marker id="slide-constructor-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#596E7C"/></marker><marker id="slide-constructor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0960D5"/></marker><marker id="slide-constructor-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0960D5"/></marker></defs>
<rect width="1280" height="720" fill="#F5F7FA"/>
<text x="40" y="60" font-family="Arial" font-size="12" fill="#596E7C">SLIDECRAFT / ARCHITECTURE</text>
<text x="40" y="112" font-family="Arial" font-size="40" font-weight="600" fill="#0A2033">From content to a shared composition</text>
<path d="M296 216 H360" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><path d="M296 408 H320 Q328 408 328 400 V248 Q328 240 336 240 H360" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><path d="M504 272 V368" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><path d="M648 416 H672 Q680 416 680 408 V344 Q680 336 688 336 H712" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><path d="M832 480 V384" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><path d="M952 328 H1024" fill="none" stroke="#596E7C" stroke-width="1.5" marker-end="url(#slide-constructor-arrow)"/><g><rect x="40" y="176" width="256" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="56" y="206" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Slide content</text><text x="56" y="230" font-family="Arial" font-size="12" fill="#596E7C">Text · facts · sources</text><text x="56" y="250" font-family="Arial" font-size="12" fill="#596E7C">Speaker notes stored separately</text></g><g><rect x="40" y="368" width="256" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="56" y="398" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Storyline</text><text x="56" y="422" font-family="Arial" font-size="12" fill="#596E7C">The argument across the deck</text><text x="56" y="442" font-family="Arial" font-size="12" fill="#596E7C">14 storylines for different tasks</text></g><g><rect x="360" y="176" width="288" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="376" y="206" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Semantic pattern</text><text x="376" y="230" font-family="Arial" font-size="12" fill="#596E7C">Comparison · process · architecture</text><text x="376" y="250" font-family="Arial" font-size="12" fill="#596E7C">Change bridge · evidence</text></g><g><rect x="360" y="368" width="288" height="96" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="376" y="398" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Existing component library</text><text x="376" y="422" font-family="Arial" font-size="12" fill="#596E7C">Layout contracts and variants</text><text x="376" y="442" font-family="Arial" font-size="12" fill="#596E7C">Add a component only to fill a gap</text></g><g><rect x="712" y="272" width="240" height="112" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="728" y="302" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Slide constructor</text><text x="728" y="326" font-family="Arial" font-size="12" fill="#596E7C">Components + slide regions</text><text x="728" y="346" font-family="Arial" font-size="12" fill="#596E7C">One shared frame, no duplication</text></g><g><rect x="712" y="480" width="240" height="112" rx="6" fill="#FFFFFF" stroke="#DCE3EB"/><text x="728" y="510" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Theme + slide chrome</text><text x="728" y="534" font-family="Arial" font-size="12" fill="#596E7C">7 themes, independent of storyline</text><text x="728" y="554" font-family="Arial" font-size="12" fill="#596E7C">Fonts · colour · source labels</text><text x="728" y="574" font-family="Arial" font-size="12" fill="#596E7C">Page number · margins · takeaway</text></g><g><rect x="1024" y="280" width="216" height="96" rx="6" fill="#DFEAFC" stroke="#0960D5"/><text x="1040" y="310" font-family="Arial" font-size="16" font-weight="600" fill="#0A2033">Scene IR</text><text x="1040" y="334" font-family="Arial" font-size="12" fill="#596E7C">Text + geometry + roles</text><text x="1040" y="354" font-family="Arial" font-size="12" fill="#596E7C">Shared input to renderers</text></g>
<line x1="40" y1="656" x2="1240" y2="656" stroke="#DCE3EB"/>
<text x="40" y="688" font-family="Arial" font-size="12" fill="#596E7C">Storyline = the argument · exhibit = how to show the idea · theme = the look. Every storyline works with every theme.</text></svg>
