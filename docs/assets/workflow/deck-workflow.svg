<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deck-workflow-title deck-workflow-desc" id="deck-workflow-root" font-family="Arial, Helvetica, sans-serif">
<title id="deck-workflow-title">How a SlideCraft deck is created, exported and verified</title>
<desc id="deck-workflow-desc">Eight authoring stages with four human checkpoints and model tiers feed one composition engine. Content, theme and layouts compose into a measured Scene that follows calibrated PowerPoint rules; independent engines write editable PPTX, HTML and PDF; four verification levels and a final reviewer-model stage produce a user report and a review log. Calibration measures PowerPoint on demand and regenerates the shared rules.</desc>
<defs>
  <marker id="dw-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#596E7C"/></marker>
  <marker id="dw-arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#0960D5"/></marker>
  <marker id="dw-arrow-cal" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#C2410C"/></marker>
  <linearGradient id="dw-scene" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0960D5"/><stop offset="1" stop-color="#0B4AA6"/></linearGradient>
  <linearGradient id="dw-llm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D28D9"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
</defs>
<rect width="1280" height="820" fill="#F5F7FA"/>
<text x="48" y="56" font-size="13" letter-spacing="2.4" fill="#596E7C">SLIDECRAFT · END-TO-END WORKFLOW</text>
<text x="48" y="92" font-size="29" font-weight="700" fill="#0A2033">From a goal to an editable deck you can trust</text>
<text x="48" y="118" font-size="15" fill="#596E7C">Agents write content, the engine owns geometry, PowerPoint is the judge, a reviewer model closes the last mile.</text>

<g font-size="12" font-weight="700" letter-spacing="1.6" fill="#596E7C">
  <text x="48" y="160">1 · AUTHOR</text>
  <text x="48" y="352">2 · COMPOSE &amp; EXPORT</text>
  <text x="48" y="580">3 · VERIFY</text>
</g>

<!-- Lane 1 -->
