<text x="48" y="780" font-size="12.5" fill="#596E7C">Checkpoints CP1–CP4 are human decisions; the report lists what still needs one. Model tiers resolve to the newest model of each tier.</text>
<text x="48" y="800" font-size="12.5" fill="#596E7C">Generated reports stay in dist/ and tests/.output; calibration evidence lives in calibration/.</text>
