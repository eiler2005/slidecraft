# yaml-language-server: $schema=../../schemas/brief.v1.json
schemaVersion: 1
id: fde-engineer-en-v2
goal: Leaders understand what a Forward Deployed Engineer is, where the role sits in
  their AI value chain, what has to change around it, and approve a one-quarter pilot
ask: Approve a one-quarter pilot with one Forward Deployed Engineer on the
  highest-value AI workflow, with a fixed budget and weekly metrics
audience:
  who: Engineering, product and operations leaders adopting AI in their company
  knows: AI pilots are easy to start and hard to put into production; most have
    heard the job title but not what it means
  cares: Getting AI into real workflows with measurable value, what it costs, and
    what else in the organisation has to change
task: explainer and decision for leaders (second edition of the FDE briefing)
context: The FDE role started at Palantir and spread to AI labs and AI-native
  startups as enterprise AI moved from pilots to deployment. Version 2 adds the value
  chain, an organisation check (7S), the pilot plan and budget.
materials: []
length: { slides: 8 }
language: en
tone: [ clear, evidence-led ]
brand: { footer: The Forward Deployed Engineer · Briefing 2026 · v2 }
usage: [ edit-together, send-pdf, present-live ]
choice:
  storyline: research-readout
  theme: sampled from the cover photo (slidecraft theme from)
