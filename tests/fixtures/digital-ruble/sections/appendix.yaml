    https://www.cbr.ru/PSystem/dr/doc_dr/albums_r/
    https://www.cbr.ru/Content/doc/File/193355/cbdc_album_v2026.09.zip
    Альбом электронных сообщений, используемых для взаимодействия субъектов платформы цифрового рубля, версия 2026.09. Глоссарий определяет распределённый реестр как базу данных с идентичными экземплярами на узлах платформы и внесением изменений по протоколу консенсуса. Узлы платформы установлены у оператора. Оператором является Банк России. Правила формирования транзакционного сообщения описывают запись данных в распределённый реестр. Документ подтверждает DLT. Называть конкретный блокчейн-движок или алгоритм консенсуса без отдельного технического источника нельзя.
    Проверенные части альбома: Глоссарий и Правила формирования транзакционного сообщения (дайджеста) распределённого реестра, 2026.
    https://www.mos.ru/upload/documents/files/5814/Federalniizakonot31072020N259-FZ%28redot08082024.pdf
    Статья 1, часть 2 базового закона № 259-ФЗ: выпуск, учёт и обращение ЦФА через записи в информационных системах на основе распределённого реестра, а также в иных информационных системах. Ссылка ведёт на опубликованный текст редакции 08.08.2024.
    https://www.cbr.ru/finm_infrastructure/digital_oper/
    Требования к оператору информационной системы, определение прав по ЦФА.
    Общее пояснение: блокчейн является разновидностью технологии распределённого реестра. Одинаковая технология учёта не означает одинаковый юридический или экономический смысл учитываемых объектов.
    Распределённость данных совместима с централизованным управлением платформой.
