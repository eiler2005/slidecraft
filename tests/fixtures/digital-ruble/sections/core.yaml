        position:relative;.slide-title{position:absolute;top:0;left:0;right:0;font:700 14pt/1.1 var(--font-heading)}.split{height:calc(100% - 130px);margin-top:52px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.side{padding:10px;background:#F5F8FC;border-top:5px solid #155EEF}.side.right{border-color:#D84B56;background:#FFF8F8}.kind{font-size:10pt;font-weight:700;color:#155EEF}.right .kind{color:#C94A53}.side h3{margin:10px 0 8px;font:700 15pt/1.1 var(--font-heading)}.chain{display:grid;gap:5px}.node{padding:7px 9px;background:#fff;border-left:4px solid #B9D6FF;font-size:10.5pt;font-weight:700}.node:last-child{border-color:#155EEF;background:#EAF2FF;color:#155EEF}.rules{padding:9px 11px;background:#fff;border-left:4px solid #D84B56;line-height:1.45;font-size:10.5pt}.rules span{display:block}.rules span:before{content:"•";color:#C94A53;font-weight:700;margin-right:7px}.notice{position:absolute;bottom:36px;left:0;right:0;padding:6px 9px;background:#FFF1D8;color:#C96B00;text-align:center;font-weight:700;font-size:8.5pt;line-height:1.12}.govern{position:absolute;bottom:0;left:0;right:0;padding:7px 10px;background:#10263D;color:#fff;display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:9pt;line-height:1.1}.govern span:last-child{text-align:right}
    html: |
        <div class="slide-title">Один и тот же код может автоматизировать сделку — или управлять экономическим поведением</div><div class="split"><div class="side"><div class="kind">ПРОГРАММИРУЕМЫЙ ПЛАТЕЖ</div><h3>Условие относится к сделке</h3><div class="chain"><div class="node">1. Товар поставлен</div><div class="node">2. Платформа автоматически платит</div><div class="node">3. Получатель свободно тратит деньги</div></div></div><div class="side right"><div class="kind">ПРОГРАММИРУЕМЫЕ ДЕНЬГИ</div><h3>Условие следует за средствами</h3><div class="rules"><span>Только разрешенные категории товаров</span><span>Ограниченный круг получателей</span><span>Срок или территория использования</span><span>Прослеживание дальнейшей цепочки</span></div></div></div><div class="notice">На 01.09.2026 собственные цифровые рубли можно тратить свободно; маркирование — официально описанная техническая возможность, а не общее правило.</div><div class="govern"><span>Кто вправе задавать условия?</span><span>Согласие · Законное основание · Ограниченный срок · Право обжалования</span></div>
    notes: |-
      Тезис для обсуждения: смарт-контракт сам по себе нейтрален; общественный риск определяется полномочиями того, кто может задать условия расходования.
