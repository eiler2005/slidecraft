        position:relative;.slide-title{position:absolute;top:0;left:0;right:0;font:700 15pt/1.12 var(--font-heading)}.paths{height:calc(100% - 130px);margin-top:54px;display:grid;grid-template-columns:1fr 1fr;gap:18px}.path{padding:11px;background:#F6F8FA;border-top:5px solid #155EEF}.path.digital{border-color:#0D9488;background:#F0FBF8}.heading{font-weight:700;font-size:11pt;color:#155EEF}.digital .heading{color:#087F75}.steps{margin-top:8px;display:grid;gap:5px}.step{position:relative;padding:7px 9px;background:#fff;border-left:4px solid #B8C5D1;display:flex;justify-content:space-between;gap:10px;font-size:10pt}.step b{font-size:11pt}.step span{text-align:right;color:var(--muted)}.step:last-child{border-left-color:#155EEF;background:#EAF2FF}.digital .step:last-child{border-left-color:#0D9488;background:#D8F4EE}.reverse{position:absolute;bottom:38px;left:0;right:0;padding:6px 10px;background:#FFE3E5;color:#C94A53;font-weight:700;text-align:center;font-size:9pt;line-height:1.15}.takeaway{position:absolute;bottom:0;left:0;right:0;padding:7px 11px;background:#D8F4EE;border-left:7px solid #0D9488;color:#087F75;font-weight:700;font-size:10pt;line-height:1.15}
    html: |
        <div class="slide-title">Цифровой рубль не дает прямого мультипликатора; его эффект на рост — косвенный</div><div class="paths"><div class="path"><div class="heading">БАНКОВСКИЕ ДЕНЬГИ</div><div class="steps"><div class="step"><b>Кредит</b><span>банк создает актив</span></div><div class="step"><b>Новый депозит</b><span>возникают новые деньги M2</span></div><div class="step"><b>Расходы и инвестиции</b><span>финансирование спроса и проектов</span></div><div class="step"><b>Выпуск и занятость</b><span>при наличии ресурсов и спроса</span></div></div></div><div class="path digital"><div class="heading">ЦИФРОВОЙ РУБЛЬ</div><div class="steps"><div class="step"><b>Платеж</b><span>перевод между кошельками ЦБ</span></div><div class="step"><b>Быстрее и дешевле</b><span>ниже платежные издержки</span></div><div class="step"><b>Автоматизация</b><span>условные платежи и расчеты</span></div><div class="step"><b>Производительность</b><span>возможный косвенный эффект</span></div></div></div></div><div class="reverse">Обратный канал: устойчивый отток депозитов → дороже фондирование банков → потенциально дороже кредит.</div><div class="takeaway">Оценивать цифровой рубль нужно по снижению трения в расчетах — и по цене возможного оттока банковских депозитов.</div>
    notes: |-
      [Sources]
      - https://www.bankofengland.co.uk/quarterly-bulletin/2014/q1/money-creation-in-the-modern-economy
      - https://www.bis.org/publications/aer-2020/central-banks-payments-digital-era.htm
      - https://www.cbr.ru/content/document/file/120075/concept_08042021.pdf

