        <div class="slide-title">Чем ближе деньги к единому реестру, тем точнее их можно проследить и ограничить</div><table><thead><tr><th>КРИТЕРИЙ</th><th>Наличные</th><th>Безналичные</th><th>Цифровой рубль</th></tr></thead><tbody><tr><td>Запись операции</td><td>Обычно нет</td><td>Есть</td><td>Есть всегда</td></tr><tr><td>Где хранятся данные</td><td>Вне реестра</td><td>Распределены по банкам</td><td>Единая платформа ЦБ</td></tr><tr><td>Анонимность</td><td>Практически высокая</td><td>Нет</td><td>Не предусмотрена</td></tr><tr><td>Блокировка</td><td>Физически сложна</td><td>Через банк</td><td>Централизованно</td></tr><tr><td>Правила для потока денег</td><td>Почти невозможны</td><td>В отдельных продуктах</td><td>Технически встроимы</td></tr></tbody></table><div class="progress">Рост централизации, скорости применения правил и детализации контроля</div><div class="footer">Разница не в том, что безналичные деньги «не оставляют след», а в том, кто хранит полный реестр и применяет правила.</div>
