  html: |-
    <div class="s09"><div class="s09-title">CBDC — не один продукт: разные страны решают разные задачи</div><aside class="s09-stat"><div class="s09-num">91%</div><b>из 93 центробанков</b><p>изучали розничную,<br>оптовую CBDC или обе<br>модели</p><hr><strong>Оптовые проекты в среднем продвинулись дальше розничных</strong></aside><section class="s09-grid"><article class="s09-cell"><div class="s09-tag">РОЗНИЧНЫЕ ЦИФРОВЫЕ НАЛИЧНЫЕ</div><h3>Россия · Китай</h3><p>Публичные деньги для ежедневных платежей; банки остаются интерфейсом.</p></article><article class="s09-cell"><div class="s09-tag">ПРИВАТНОСТЬ И АВТОНОМИЯ</div><h3>Еврозона</h3><p>Офлайн-приватность и публичная альтернатива картам; не «программируемые деньги».</p></article><article class="s09-cell"><div class="s09-tag">ИНКЛЮЗИЯ И УСТОЙЧИВОСТЬ</div><h3>Багамы · Ямайка · Нигерия</h3><p>Ранние запуски в небольших экономиках: доступность, островная и платежная устойчивость.</p></article><article class="s09-cell"><div class="s09-tag">ТОКЕНИЗИРОВАННЫЕ РАСЧЁТЫ</div><h3>Бразилия Drex</h3><p>Расчётный актив для банков и токенизированных рынков, а не просто новый кошелёк гражданина.</p></article></section><div class="s09-take">Слово CBDC описывает эмитента, но не дизайн: розничная и оптовая модели дают разные выгоды, риски и роли банкам.</div></div>
  notes: |-
    По опросу BIS за 2024 год 91% из 93 опрошенных центробанков изучали хотя бы одну модель CBDC; оптовые проекты в среднем находились на более продвинутых стадиях.
    [Sources]
    - https://www.bis.org/publications/paper-159-advancing-tandem-results-2024-bis-survey-central-bank-digital-currencies-and-crypto
