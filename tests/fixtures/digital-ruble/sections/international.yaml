  lead: "8. МЕЖДУНАРОДНАЯ ПАНОРАМА · 09"
  layout: freeform-canvas
  variant: body
  alt: "91% из 93 центробанков изучали CBDC; четыре направления международных проектов: розничные наличные, приватность, инклюзия и токенизированные расчёты."
  css: |-
    .s09{display:grid;grid-template-columns:1fr 2.35fr;grid-template-rows:1fr auto;gap:18px;height:100%;font-family:var(--font-body);color:var(--ink)}.s09-stat{grid-row:1;background:var(--ink);color:#fff;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center}.s09-num{font:700 58pt/1 var(--font-heading)}.s09-stat b{font-size:19pt;color:#65d8ee;margin-top:14px}.s09-stat p{font-size:16pt;line-height:1.22;margin:28px 0}.s09-stat hr{width:100%;border:0;border-top:1px solid #718196}.s09-stat strong{font-size:15pt;line-height:1.24;margin-top:24px}.s09-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.s09-cell{border-left:7px solid var(--accent);padding:13px 18px;background:var(--surface);border-radius:10px}.s09-cell:nth-child(2){border-color:#7454b5}.s09-cell:nth-child(3){border-color:#009b8c}.s09-cell:nth-child(4){border-color:#e58a08}.s09-tag{font-weight:700;font-size:11pt;color:var(--accent)}.s09-cell:nth-child(2) .s09-tag{color:#7454b5}.s09-cell:nth-child(3) .s09-tag{color:#009b8c}.s09-cell:nth-child(4) .s09-tag{color:#c97100}.s09-cell h3{font:700 21pt/1.1 var(--font-heading);margin:10px 0}.s09-cell p{font-size:15pt;line-height:1.2;margin:0;color:var(--muted)}.s09-take{grid-column:1/-1;border-left:8px solid var(--accent);background:#e4efff;padding:16px 20px;font-size:16pt;font-weight:700;line-height:1.2}
