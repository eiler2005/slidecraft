    <div class="s13"><div class="s13-title">Доступ ФНС к данным об операциях</div><section><div class="s13-table"><div class="s13-th">Аспект</div><div class="s13-th">Что предусматривает форма</div><div class="s13-th">Как интерпретировать</div><div class="s13-key">Операция</div><div>Дата и время, сумма, назначение, сведения о плательщике и получателе</div><div>История движения средств</div><div class="s13-key">Устройство</div><div>IP, MAC, телефон, SIM-карта или иной идентификатор устройства</div><div>Поля формы выписки. Состав доступных данных зависит от операции</div><div class="s13-key">Доступ</div><div>Банк и оператор платформы предоставляют информацию по запросу ФНС</div><div>Процедура налогового контроля. Общий IP или устройство требуют проверки</div></div><div class="s13-take">Сопоставление устройств помогает искать связи между операциями.<br>Вывод о нарушении требует других фактов и документов.</div></section><section><div class="s13-foot">Технические идентификаторы предусмотрены и в формах по обычным банковским счетам.</div><div class="s13-src">CNews, 09.09.2026   ФНС, приказ № ЕД-1-2/591@   Предыдущая форма банковской выписки</div></section></div>
  notes: |-
    Формы описывают сведения, предоставляемые по запросам налоговых органов. Приказ устанавливает вступление в силу через девять месяцев после официального опубликования, но не ранее 1 июля 2027 года. Наличие поля в форме не означает доступность каждого идентификатора в каждой операции. Технический след сам по себе не доказывает нарушение.
    Форма по цифровому рублю: https://www.consultant.ru/document/cons_doc_LAW_543497/5a6d4b21a0250f31330988d96a8934add666f017/
