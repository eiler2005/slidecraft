- id: s10
  title: "Главные различия — в цели, архитектуре и границах контроля"
  sources: [original-deck]
  lead: "9. СРАВНЕНИЕ СТРАН · СТАТУС НА 05.09.2026 · 10"
  layout: freeform-canvas
  variant: body
  alt: "Сравнительная таблица статуса, модели, данных и ключевой идеи CBDC в России, Китае, Еврозоне, Бразилии и на Багамах."
  css: |-
    .s10{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:9px}.s10-title{font:700 18pt/1.06 var(--font-heading);letter-spacing:-.02em}.s10-table{display:grid;grid-template-columns:.72fr 1fr 1.24fr 1.42fr 1.42fr;border:1px solid var(--ink);border-radius:10px;overflow:hidden}.s10-table div{padding:7px 8px;border-right:1px solid #b4c0cb;border-bottom:1px solid #b4c0cb;font-size:8.5pt;line-height:1.12;display:flex;align-items:center}.s10-table div:nth-child(5n){border-right:0}.s10-table div:nth-last-child(-n+5){border-bottom:0}.s10-th{background:var(--ink);color:#fff;font-size:8pt!important;font-weight:700}.s10-key{font:700 11pt/1.05 var(--font-heading);color:var(--accent)}.s10-take{border-left:6px solid #7454b5;background:#f0eaff;color:#61469e;padding:9px 12px;font-size:11pt;font-weight:700;line-height:1.16}
  html: |-
    <div class="s10"><div class="s10-title">Главные различия — в цели, архитектуре и границах контроля</div><div class="s10-table"><div class="s10-th">СТРАНА</div><div class="s10-th">СТАТУС</div><div class="s10-th">МОДЕЛЬ</div><div class="s10-th">ДАННЫЕ И ПРАВИЛА</div><div class="s10-th">ГЛАВНАЯ ИДЕЯ</div><div class="s10-key">Россия</div><div>Массовое подключение с 01.09.2026</div><div>Розничная; платформа ЦБ, доступ через банки</div><div>Не анонимна; единый реестр; смарт-контракты и маркирование</div><div>Платежная инфраструктура + автоматизация целевых потоков</div><div class="s10-key">Китай</div><div>Пилот / расширенное тестирование</div><div>Розничная; двухуровневая через операторов</div><div>«Управляемая анонимность»; отслеживание по закону</div><div>Цифровая замена M0 и эффективность розничных платежей</div><div class="s10-key">Еврозона</div><div>Подготовка; возможная эмиссия в 2029</div><div>Розничная; через банки и публичных посредников</div><div>ЦБ не должен видеть личность; офлайн — приватность как у наличных</div><div>Публичная европейская опция; не программируемые деньги</div><div class="s10-key">Бразилия</div><div>Пилот Drex</div><div>Токенизированная оптовая инфраструктура</div><div>Разрешённые участники; автоматизация смарт-контрактами</div><div>Расчёт токенизированных активов и обязательств</div><div class="s10-key">Багамы</div><div>Запущен</div><div>Розничная; через платёжных провайдеров</div><div>KYC и уровни кошельков</div><div>Финансовая доступность и устойчивость островной системы</div></div><div class="s10-take">Россия и Китай допускают более сильную управляемость потоков; проект евро сознательно отделяет условный платёж от ограничений на сами деньги.</div></div>
  notes: |-
    Сравнение сводит официальные проектные решения. Формулировка о степени управляемости — аналитический вывод из архитектуры и заявленных функций, а не правовой рейтинг стран.
    [Sources]
    - https://www.cbr.ru/faq/dr/
    - https://www.cbr.ru/content/document/file/120075/concept_08042021.pdf
    - https://www.pbc.gov.cn/en/3935690/3935759/4696666/2022110110364344083.pdf
    - https://www.ecb.europa.eu/euro/digital_euro/html/index.en.html
    - https://www.ecb.europa.eu/euro/digital_euro/features/privacy/html/index.en.html
    - https://www.ecb.europa.eu/euro/digital_euro/features/facts/html/index.en.html
    - https://www.bcb.gov.br/estabilidadefinanceira/drex
    - https://www.sanddollar.bs/

- id: s11
  title: "Трансграничный потенциал — в сокращении расчётной цепочки, а не в отмене ограничений"
  sources: [original-deck]
  lead: "10. МЕЖДУНАРОДНЫЕ ПЛАТЕЖИ · 11"
  layout: freeform-canvas
  variant: body
  alt: "Сравнение корреспондентской цепочки и связанных CBDC-платформ; технологии сокращают посредников, но не решают вопросы ликвидности, права, AML/KYC, санкций и доступа."
  css: |-
    .s11{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.15fr .7fr auto;gap:14px}.s11 h3{font:700 19pt/1.1 var(--font-heading);margin:7px 0 12px}.s11 .tag{display:inline-block;padding:5px 14px;border-radius:999px;background:#edf0f3;font-size:11pt;font-weight:700;color:var(--muted)}.s11 .tag.mint{background:#dff5f1;color:#008c80}.s11-box{background:var(--surface);border:1px solid #d5dee8;border-radius:14px;padding:14px}.s11-flow{height:55%;display:flex;align-items:center;gap:12px;justify-content:center}.s11-node{flex:1;text-align:center;padding:15px 8px;border:2px solid var(--accent);border-radius:10px;color:var(--accent);font-size:18pt;font-weight:700}.s11-node.mid{border-color:#c5d0db;color:var(--muted)}.s11-node.dark{background:var(--ink);border-color:var(--ink);color:#fff}.s11-arrow{color:#aebbc7;font-size:26pt}.s11-arrow.mint{color:#9adfd6}.s11-caption{text-align:center;color:var(--muted);font-size:13pt;line-height:1.18}.s11-caption.mint{color:#008c80;font-weight:700}.s11-effect{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.s11-effect article{padding:12px;border-radius:10px;background:var(--surface);border:1px solid #d5dee8;text-align:center;font-size:13pt;font-weight:700;line-height:1.15}.s11-effect article b{display:block;font-size:20pt;color:var(--accent);margin-bottom:6px}.s11-limit{padding:14px 18px;border-radius:12px;background:#fee8e8;color:#c8444b;font-size:14pt;font-weight:700;line-height:1.25}.s11-take{grid-column:1/-1;border-left:8px solid var(--ink);padding:14px 18px;background:#edf1f4;font-size:15pt;font-weight:700;line-height:1.2}
    .s11{grid-template-rows:1.1fr .65fr auto;gap:9px}.s11 h3{font-size:16pt;margin:5px 0 7px}.s11 .tag{padding:3px 10px;font-size:9pt}.s11-box{padding:9px}.s11-flow{height:54%;gap:8px}.s11-node{padding:10px 6px;font-size:14pt}.s11-arrow{font-size:20pt}.s11-caption{font-size:10pt}.s11-effect{gap:8px}.s11-effect article{padding:8px;font-size:10.5pt}.s11-effect article b{font-size:16pt;margin-bottom:3px}.s11-limit{padding:9px 12px;font-size:11pt}.s11-take{padding:9px 12px;font-size:12pt}
    .s11{grid-template-rows:auto 1.1fr .65fr auto}.s11-title{grid-column:1/-1;font:700 19pt/1.06 var(--font-heading);letter-spacing:-.02em}
  html: |-
    <div class="s11"><div class="s11-title">Трансграничный потенциал — в сокращении расчётной цепочки, а не в отмене ограничений</div><section><span class="tag">СЕГОДНЯ</span><h3>Корреспондентская цепочка</h3><div class="s11-box"><div class="s11-flow"><div class="s11-node">Банк A</div><div class="s11-arrow">→</div><div class="s11-node mid">1–3 банка<br>счета +<br>сообщения</div><div class="s11-arrow">→</div><div class="s11-node">B</div></div><div class="s11-caption">Предфондирование · комиссии · рабочие часы · риск разрыва FX-расчёта</div></div></section><section><span class="tag mint">ПОТЕНЦИАЛ CBDC</span><h3>Связанные платформы / общий мост</h3><div class="s11-box"><div class="s11-flow"><div class="s11-node">CBDC A</div><div class="s11-arrow mint">→</div><div class="s11-node dark">PvP<br>атомарный обмен</div><div class="s11-arrow mint">→</div><div class="s11-node">CBDC B</div></div><div class="s11-caption mint">24/7 · меньше посредников · платёж только одновременно с встречным платежом</div></div></section><section><div class="tag" style="color:var(--accent);background:none;padding-left:0">ВОЗМОЖНЫЙ ЭФФЕКТ</div><div class="s11-effect"><article><b>−</b>короче цепочка</article><article><b>↓</b>меньше средств заранее</article><article><b>PvP</b>ниже риск поставки валюты</article></div></section><section><div class="tag" style="color:#d24d54;background:none;padding-left:0">ЧТО ТЕХНОЛОГИЯ НЕ РЕШАЕТ САМА</div><div class="s11-limit">Валютная ликвидность и курс · право и финальность расчёта<br>AML/KYC и обмен данными · санкции, доверие и доступ участников</div></section><div class="s11-take">Для цифрового рубля трансграничный эффект возникнет только после соглашений и технической связки с валютами партнёров; внутренний запуск этого не даёт.</div></div>
  notes: |-
    mBridge достиг стадии MVP в 2024 году и показал модель общей multi-CBDC платформы. Project Mariana показал техническую реализуемость трансграничной торговли и расчётов оптовыми CBDC. Это эксперименты, а не гарантия политического или правового доступа России к таким платформам.
    [Sources]
    - https://www.bis.org/project/mbridge
    - https://www.bis.org/project/mariana
    - https://www.bis.org/media-releases/20211007-cpmi-calls-ideas-solutions-expand-pvp-settlement
    - https://www.cbr.ru/content/document/file/120075/concept_08042021.pdf

- id: s12
